name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能建议！请详细描述您的需求，帮助我们更好地改进 OneinStack。

  - type: textarea
    id: feature
    attributes:
      label: 想要什么功能
      description: 请清晰地描述您希望添加的功能
      placeholder: 例如：支持安装 XXX 数据库
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 为什么需要 / 使用场景
      description: 请说明这个功能对您的价值和具体使用场景
      placeholder: |
        在实际生产环境中，我们需要...
        目前的解决方案存在以下问题...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 期望行为
      description: 请描述这个功能的理想工作方式
      placeholder: |
        1. 在 install.sh 中增加选项...
        2. 配置文件支持...
        3. 最终效果...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 有无替代方案
      description: 是否有其他方式可以实现类似功能？
      placeholder: |
        目前可以手动执行以下步骤来实现...
        或者使用第三方工具...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 任何其他相关信息、参考链接或截图
    validations:
      required: false
